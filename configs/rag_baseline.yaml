# RAG-Baseline mit LFM2.5-Embedding-350M.
#
# Zweck: messen, bevor trainiert wird. Laeuft komplett auf CPU/T4 und beantwortet
# die Frage "brauche ich ueberhaupt einen Adapter?" mit Zahlen statt Bauchgefuehl.
#
#   python -m muscal_rag build --config configs/rag_baseline.yaml
#   python -m muscal_rag eval  --config configs/rag_baseline.yaml
#
# Pipeline-Test ohne Modell-Download (~700 MB) und ohne GPU:
#   python -m muscal_rag eval --config configs/rag_baseline.yaml --backend hashing

docs_dir: data/rag_docs
index_dir: outputs/rag/index

embedding:
  backend: sentence-transformers   # sentence-transformers | hashing
  model: LiquidAI/LFM2.5-Embedding-350M
  # Das Modell ist mit asymmetrischen Prefixen trainiert -- beide muessen gesetzt sein.
  query_prompt: query
  document_prompt: document
  normalize: true
  batch_size: 32
  dim: 1024                        # nur fuer das hashing-Backend

chunking:
  chunk_size: 512                  # Tokens == Dokumentlaenge des Embedding-Modells
  overlap: 64
  chars_per_token: 4.0

retrieval:
  top_k: 5
  # Erst wenn recall@k nicht reicht:
  # rerank_model: LiquidAI/LFM2.5-ColBERT-350M
  rerank_top_k: 20

generation:
  enabled: false                   # Retrieval zuerst messen, Antworten danach
  model: LiquidAI/LFM2.5-1.2B-Instruct
  max_new_tokens: 256

eval:
  eval_file: data/rag_eval_example.jsonl
  ks: [1, 3, 5, 10]
  show_misses: 5
