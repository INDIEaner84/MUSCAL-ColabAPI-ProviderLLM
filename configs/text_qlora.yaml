# QLoRA SFT for a dense LFM2.5 text model.
# Runs on a free Colab T4 (15 GB). See configs/moe_qlora.yaml for the MoE variant.
model:
  id: LiquidAI/LFM2.5-1.2B-Instruct
  track: text
  attn_implementation: sdpa

quant:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: auto

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:
  train_file: data/train.jsonl
  eval_file: null
  max_length: 1024
  packing: false
  completion_only_loss: true

training:
  output_dir: outputs/lfm25-1.2b-text
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  logging_steps: 10
  save_strategy: epoch
  save_total_limit: 2
  gradient_checkpointing: true
  optim: auto
  seed: 42
  bf16: auto

export:
  merge_adapter: true
  merged_dir: outputs/lfm25-1.2b-text/merged
  push_to_hub: false
  save_gguf: false
